name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - name: unit tests
        run: |
          set -o pipefail
          pnpm test:unit 2>&1 | tee unit-test.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-log
          path: unit-test.log
      - run: pnpm test:chaos
      - run: python docs/scripts/check_ui_spec.py
      - run: python docs/scripts/check_tool_spec.py --tools docs/tools --prd docs/PRD.md
      - run: pnpm gen:check
      - run: pnpm build

  e2e:
    runs-on: windows-latest
    needs: verify
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: e2e
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee e2e.log
      - name: e2e failure summary
        if: failure()
        shell: bash
        run: |
          # 把日志尾部变成 annotation：公开仓库无需 token 也能从 API 读到失败用例。
          tail -n 60 e2e.log | while IFS= read -r line; do
            line="${line//$'\r'/}"
            if [ -n "$line" ]; then echo "::error title=e2e::$line"; fi
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-log-trace
          path: |
            e2e.log
            test-results/

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [verify]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - uses: actions/upload-artifact@v4
        with:
          name: nsis
          path: release/*.exe
