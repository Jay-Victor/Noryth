name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm test:unit
      - run: python docs/scripts/check_ui_spec.py
      - run: python docs/scripts/check_tool_spec.py --tools docs/tools --prd docs/PRD.md
      - run: pnpm gen:check
      - run: pnpm build

  e2e:
    runs-on: windows-latest
    needs: verify
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [verify]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - uses: actions/upload-artifact@v4
        with:
          name: nsis
          path: release/*.exe
