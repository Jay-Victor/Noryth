name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - name: unit tests
        run: |
          set -o pipefail
          pnpm test:unit 2>&1 | tee unit-test.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-log
          path: unit-test.log
      - run: pnpm test:chaos
      - run: python docs/scripts/check_ui_spec.py
      - run: python docs/scripts/check_tool_spec.py --tools docs/tools --prd docs/PRD.md
      - run: pnpm gen:check
      - run: pnpm build

  e2e:
    runs-on: windows-latest
    needs: verify
    # 分两片：历史上迟到的一次静默早退都发生在 memory.spec 之后（同一 runner 连跑 15 个
    # Electron 用例），分片让 plan.spec 起在干净的 runner 上，也把单 job 时长压掉一半。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: e2e
        run: |
          # 重定向到文件而不是 | tee：Node 写文件是同步的，进程被杀时不会丢尾部输出。
          pnpm test:e2e --shard=${{ matrix.shard }}/2 > e2e.log 2>&1
      - name: e2e failure summary
        if: failure()
        shell: bash
        run: |
          # 先打印诊断（进 job 日志），再把尾部变成 annotation（公开仓库可匿名读 API）。
          echo "=== failure lines ==="
          grep -nE "✘|Error|error:|failed|Timeout|exited" e2e.log | tail -n 40 || true
          echo "=== tail ==="
          tail -n 120 e2e.log || true
          tail -n 60 e2e.log | while IFS= read -r line; do
            line="${line//$'\r'/}"
            if [ -n "$line" ]; then echo "::error title=e2e::$line"; fi
          done
      - name: crash diagnostics
        if: failure()
        shell: pwsh
        run: |
          Write-Output '=== OS / memory / disk ==='
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Output ("FreePhysicalMB={0} TotalVisibleMB={1}" -f [math]::Round($os.FreePhysicalMemory/1024), [math]::Round($os.TotalVisibleMemorySize/1024))
          Get-PSDrive C | Select-Object Used,Free | Format-List
          Write-Output '=== top processes ==='
          Get-Process | Sort-Object WS -Descending | Select-Object -First 10 Name,Id,@{n='WS_MB';e={[math]::Round($_.WS/1MB)}} | Format-Table
          Write-Output '=== Application event log (last 20 min) ==='
          try {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-20) } -ErrorAction Stop |
              Select-Object -First 25 TimeCreated,ProviderName,Id,LevelDisplayName,Message |
              Format-List
          } catch {
            Write-Output ("event log unavailable: {0}" -f $_.Exception.Message)
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-log-trace-${{ matrix.shard }}
          path: |
            e2e.log
            test-results/

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [verify]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
      - uses: actions/upload-artifact@v4
        with:
          name: nsis
          path: release/*.exe
