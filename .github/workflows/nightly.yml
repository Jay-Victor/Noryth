name: nightly

# 性能基线与混沌（DEV-PLAN §13.1：性能/混沌 nightly，不进每次提交的门）。
# 只在默认分支（dev）上按计划触发；workflow_dispatch 可手动跑。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  perf:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:perf

  chaos:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:chaos

  # E2E-M1-A（PHASE-18 §5.2）：3 卷 × 10 章 = 30 章 / 540 拍连续创作。
  # 提交门只跑 3 章 E2E-M1-SMOKE；这里是 nightly / 发布前的长跑。
  m1-a:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: e2e M1-A (30 chapters)
        run: pnpm test:e2e:m1a
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-m1a-results
          path: test-results/

  # E2E-M2-A（PHASE-24 §5.1）：3 卷 × 10 章 × 3 场 × 8 拍 = 720 拍 / ≥10 万字。
  # 提交门只跑 3 章 E2E-M2-SMOKE；这里是 nightly / 发布前的 10 万字长跑。
  m2-a:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: e2e M2-A (30 chapters / 100k words)
        run: pnpm test:e2e:m2a > m2a.log 2>&1 || { tail -n 120 m2a.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-m2a-results
          path: |
            m2a.log
            test-results/
