name: nightly

# 性能基线与混沌（DEV-PLAN §13.1：性能/混沌 nightly，不进每次提交的门）。
# 只在默认分支（dev）上按计划触发；workflow_dispatch 可手动跑。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  perf:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:perf

  chaos:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:chaos
