appId: app.noryth.desktop
productName: Noryth
copyright: Copyright © 2026 Noryth
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
  - node_modules/**/*
  # 嵌入只在本机 CPU 跑（ADR-0004）：只带 win32-x64 的 CPU 运行时。
  # onnxruntime-web 是浏览器/WebGPU 路径，主进程 worker 不用（省 140MB）。
  - '!node_modules/**/onnxruntime-web/**'
  - '!node_modules/**/onnxruntime-node/bin/napi-v6/linux/**'
  - '!node_modules/**/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!node_modules/**/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  - '!node_modules/**/onnxruntime-node/bin/napi-v6/win32/x64/DirectML.dll'
  - '!node_modules/**/onnxruntime-node/bin/napi-v6/win32/x64/dxcompiler.dll'
  - '!node_modules/**/onnxruntime-node/bin/napi-v6/win32/x64/dxil.dll'
asarUnpack:
  - '**/*.node'
  - '**/vec0.*'
  - '**/sqlite-vec*/**'
  - '**/onnxruntime-node/**'
extraResources:
  - from: resources/native
    to: native
  # 嵌入模型目录（可选）：M0 只有说明文件，放权重即自动随包；见 docs/adr/0004-embedding.md
  - from: resources/models
    to: models
# 离线可用：直接用 pnpm 装好的 Electron 运行时，避免打包时再去下载（CI 同样适用）
electronDist: node_modules/electron/dist
npmRebuild: false
buildDependenciesFromSource: false
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Noryth
  deleteAppDataOnUninstall: false
