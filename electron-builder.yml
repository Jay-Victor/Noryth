appId: app.noryth.desktop
productName: Noryth
copyright: Copyright © 2026 Noryth
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
  - node_modules/**/*
asarUnpack:
  - '**/*.node'
  - '**/vec0.*'
  - '**/sqlite-vec*/**'
extraResources:
  - from: resources/native
    to: native
npmRebuild: false
buildDependenciesFromSource: false
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Noryth
  deleteAppDataOnUninstall: false
